# DailyCheck CI：测试门禁 + 四报告门禁。部署不在此工作流——蓝绿部署由 Prod Agent
#
# 零新增失败门禁：tests/known_failures.txt 是已知 pre-existing 失败基线（只许收缩）。
# 全量包含 tests/mcp_server；MCP 测试使用临时 SQLite 与日志，不依赖容器或真实库。
name: CI

env:
  CI_REPOSITORY: ${{ github.repository }}
  CI_RUN_ID: ${{ github.run_id }}
  CI_RUN_ATTEMPT: ${{ github.run_attempt || '1' }}
  CI_EVENT: ${{ github.event_name }}
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
  CI_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
  CI_EVENT_SHA: ${{ github.sha }}
  CI_NATIVE_PRODUCER: ${{ github.server_url == 'https://github.com' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  PIP_TRUSTED_HOST: mirrors.aliyun.com

permissions:
  contents: read
  pull-requests: read

# Only superseded CI for the same PR is canceled. No deployment serialization.
concurrency:
  group: ci-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name != 'pull_request' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # GitHub native H/G runs on the standard arm64 VM that matches the tested
    # runtime. Gitea keeps its original runner and push behavior; only the
    # redundant full GitHub main-push run is skipped.
    if: github.server_url != 'https://github.com' || github.event_name != 'push'
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      pytest_summary_b64: ${{ steps.pytest_summary.outputs.pytest_summary_b64 }}
      pytest_envelope_sha256: ${{ steps.pytest_summary.outputs.pytest_envelope_sha256 }}
      member_manifest_b64: ${{ steps.native_producer.outputs.member_manifest_b64 || steps.member_manifest.outputs.member_manifest_b64 }}
      native_test_b64: ${{ steps.native_producer.outputs.native_test_b64 }}
    steps:
      - name: Prepare isolated job paths
        run: |
          set -euo pipefail
          CI_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/dailycheck-${CI_RUN_ID}-${CI_RUN_ATTEMPT}.XXXXXX")"
          mkdir -p "${CI_ROOT}/tmp" "${CI_ROOT}/db"
          printf 'CI_ROOT=%s\nTMPDIR=%s/tmp\nDAILYCHECK_CI_TMP=%s/tmp\nDAILYCHECK_DB_DIR=%s/db\n' \
            "$CI_ROOT" "$CI_ROOT" "$CI_ROOT" "$CI_ROOT" >> "$GITHUB_ENV"

      - name: Checkout candidate H on GitHub
        if: github.server_url == 'https://github.com'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout candidate H on Gitea
        if: github.server_url != 'https://github.com'
        env:
          CHECKOUT_SERVER: ${{ github.server_url }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64, os, re, subprocess
          from urllib.parse import urlsplit
          server = os.environ["CHECKOUT_SERVER"].rstrip("/")
          parsed = urlsplit(server)
          repo, head, base = (os.environ[k] for k in ("CI_REPOSITORY", "CI_HEAD_SHA", "CI_BASE_SHA"))
          token = os.environ["CHECKOUT_TOKEN"]
          if (parsed.scheme not in {"http", "https"} or not parsed.hostname or parsed.username
                  or parsed.password or parsed.path or parsed.query or parsed.fragment
                  or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo)
                  or not re.fullmatch(r"[0-9a-f]{40}", head) or not token
                  or any(ord(c) < 33 or ord(c) == 127 for c in token)
                  or base and not re.fullmatch(r"[0-9a-f]{40}", base)):
              raise SystemExit("invalid source checkout identity/credentials")
          workspace = os.environ["GITHUB_WORKSPACE"]
          auth = base64.b64encode(("x-access-token:" + token).encode()).decode()
          env = {**os.environ, "GIT_TERMINAL_PROMPT": "0", "GIT_CONFIG_COUNT": "2",
                 "GIT_CONFIG_KEY_0": f"http.{server}/.extraheader",
                 "GIT_CONFIG_VALUE_0": "AUTHORIZATION: basic " + auth,
                 "GIT_CONFIG_KEY_1": "safe.directory", "GIT_CONFIG_VALUE_1": workspace}
          def git(*args):
              subprocess.run(["git", *args], cwd=workspace, env=env, check=True)
          git("init")
          existing = subprocess.run(["git", "remote", "get-url", "origin"], cwd=workspace, env=env, capture_output=True)
          git("remote", "set-url" if existing.returncode == 0 else "add", "origin", f"{server}/{repo}.git")
          git("fetch", "--force", "--no-tags", "origin", "+refs/heads/main:refs/remotes/origin/main", head, *([base] if base else []))
          git("checkout", "--force", "--detach", head)
          git("clean", "-ffdx")
          PYCODE

      - name: Setup Python on GitHub
        if: github.server_url == 'https://github.com'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python on Gitea (runner image)
        if: github.server_url != 'https://github.com'
        run: python3 --version && python3 -m pip --version

      - name: Execute approved isolated native producer
        id: native_producer
        if: env.CI_NATIVE_PRODUCER == 'true'
        env:
          CI_PRODUCER_MANIFEST_BLOB: df4cb77671515cc50be9c3465290347b8a1ede76
          NATIVE_QUEUE_READ_TOKEN: ${{ github.token }}
          NATIVE_CONTEXT: test
        run: |
          set -euo pipefail
          # Literal approved manifest blob; HEAD/PR body cannot select a pin.
          # The platform Python is isolated from candidate imports and venvs.
          python3 -I - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          pin = os.environ["CI_PRODUCER_MANIFEST_BLOB"]
          def blob(oid):
              raw = subprocess.check_output(["git", "cat-file", "blob", oid])
              actual = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
              if actual != oid: raise SystemExit("approved producer object changed")
              return raw
          raw = blob(pin)
          manifest = json.loads(raw)
          root = pathlib.Path(os.environ["CI_ROOT"], "authority")
          root.mkdir()
          for name, oid in manifest["files"].items():
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts: raise SystemExit("invalid producer path")
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(blob(oid))
          (root / "scripts/ci/producer_manifest.json").write_bytes(raw)
          (root / "dc_approved_evidence.py").write_bytes((root / "scripts/ci/pytest_evidence.py").read_bytes())
          for package in ("scripts", "scripts/ci", "scripts/agent_framework"):
              (root / package / "__init__.py").write_bytes(b"")
          PYCODE
          # GitHub standard VM: the fixed trusted producer runs with passwordless
          # sudo only so it can own/remove UID65532 private scratch. Only the
          # explicit required CI/event/upstream/read-token variables are kept;
          # no import path or candidate venv is inherited and Python runs with -I.
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            sudo -n --preserve-env=CI_ROOT,CI_PRODUCER_MANIFEST_BLOB,NATIVE_CONTEXT,NATIVE_QUEUE_READ_TOKEN,NATIVE_TEST_B64,UPSTREAM_RESULT,UPSTREAM_MEMBER_MANIFEST_B64,CI_REPOSITORY,CI_RUN_ID,CI_RUN_ATTEMPT,CI_EVENT,CI_HEAD_SHA,CI_BASE_SHA,CI_GROUP_SHA,CI_EVENT_SHA,GITHUB_EVENT_PATH,GITHUB_OUTPUT,GITHUB_SERVER_URL \
              python3 -I "${CI_ROOT}/authority/scripts/ci/trusted_producer.py" job --context "${NATIVE_CONTEXT}"
          else
            python3 -I "${CI_ROOT}/authority/scripts/ci/trusted_producer.py" job --context "${NATIVE_CONTEXT}"
          fi
      - name: Upload native failure diagnostics
        if: failure() && github.server_url == 'https://github.com' && env.CI_NATIVE_PRODUCER == 'true' && steps.native_producer.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-diagnostics-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_ROOT }}/native-diagnostics
          if-no-files-found: ignore
          retention-days: 2
      - name: Resolve authenticated merge-group members
        id: member_manifest
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.event_name == 'merge_group')
        env:
          NATIVE_QUEUE_READ_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/merge_group.py manifest --manifest "${CI_ROOT}/members.json"
          printf 'CI_MEMBER_MANIFEST=%s/members.json\n' "$CI_ROOT" >> "$GITHUB_ENV"

      - name: Bind tested H and event H/B to this run
        if: env.CI_NATIVE_PRODUCER != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${CI_ROOT}/tmp" "${CI_ROOT}/db"
          python3 scripts/ci/candidate_binding.py "${CI_ROOT}/binding.json"

      - name: Install dependencies
        if: env.CI_NATIVE_PRODUCER != 'true'
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            unset PIP_INDEX_URL PIP_TRUSTED_HOST
          fi
          python3 -m venv "${CI_ROOT}/venv"
          ${CI_ROOT}/venv/bin/pip install -r requirements.txt -q
          ${CI_ROOT}/venv/bin/pip install pytest "ruff==0.16.10" "PyYAML==6.0.3" -q

      - name: Ruff (changed .py files only)
        if: env.CI_NATIVE_PRODUCER != 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 三点 diff（merge-base）只算「本分支引入的改动」。用两点会把 base
            # 之后 main 上别人合入的改动也列进来 —— 2026-10-24 PR #22 实测：
            # 分支落后 main 一个提交，于是列出了已被删除的
            # tests/test_store_ordering_board.py，ruff 报 E902 整步失败。
            # --diff-filter=d 再兜一层：本分支自己删掉的 .py 不喂给 ruff。
            FILES=$(git diff --name-only --diff-filter=d \
              "${CI_BASE_SHA}...HEAD" -- '*.py')
          else
            FILES=$(git diff --name-only --diff-filter=d "HEAD~1" -- '*.py')
          fi
          if [ -n "$FILES" ]; then
            echo "ruff checking: $FILES"
            ${CI_ROOT}/venv/bin/ruff check $FILES
          else
            echo "no python files changed, skip"
          fi

      - name: Pytest (full suite, including MCP)
        if: env.CI_NATIVE_PRODUCER != 'true'
        run: |
          set -euo pipefail
          TEST_DB_DIR="$(mktemp -d)"
          python3 -c 'import os; from pathlib import Path; [Path(os.environ["CI_ROOT"], p).unlink(missing_ok=True) for p in ["pytest-session.json", "pytest-native.exit", "pytest-evidence.json"]]'
          set +e
          DAILYCHECK_DB_DIR="${TEST_DB_DIR}" \
            ${CI_ROOT}/venv/bin/python -m pytest --basetemp=${CI_ROOT}/pytest-dc -q --tb=no -rfE --color=no \
            -p scripts.ci.pytest_evidence --dc-evidence=${CI_ROOT}/pytest-session.json \
            > ${CI_ROOT}/pytest-output.txt 2>&1
          PYTEST_EXIT=$?
          set -e
          printf '%s\n' "${PYTEST_EXIT}" > ${CI_ROOT}/pytest-native.exit
          tail -3 ${CI_ROOT}/pytest-output.txt

      - name: Zero-new-failure gate
        if: env.CI_NATIVE_PRODUCER != 'true'
        run: ${CI_ROOT}/venv/bin/python scripts/check_known_failures.py ${CI_ROOT}/pytest-output.txt --pytest-exit-file ${CI_ROOT}/pytest-native.exit --session-file ${CI_ROOT}/pytest-session.json --write-evidence ${CI_ROOT}/pytest-evidence.json

      # Gitea 不支持 artifact v4。只传递下游报告和零新增门禁所需的小型摘要：
      # 全部 FAILED/ERROR、终态摘要与真实 native/session/hash 证据，不能重建假退出码。
      - name: Create compact pytest summary output
        if: env.CI_NATIVE_PRODUCER != 'true'
        id: pytest_summary
        run: python3 scripts/ci/pytest_summary.py ${CI_ROOT}/pytest-output.txt --evidence-file "${CI_ROOT}/pytest-evidence.json" --binding-file "${CI_ROOT}/binding.json" --envelope-output "${CI_ROOT}/envelope.json" --digest-output

      - name: Attest test evidence for independent Prod reader
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.server_url == 'https://github.com' && (github.event_name == 'pull_request' || github.event_name == 'merge_group'))
        run: python3 scripts/ci/merge_group.py attest --context test --manifest "${CI_ROOT}/members.json"

  agent-framework-reports:
    # Phase MVE: 四报告门禁（独立 status check，让 branch protection 可独立勾选）
    # 详见 docs/agent-framework/v0.1.md §三
    # Always settle the required report context; missing/failed upstream is an explicit failure.
    needs: test
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    steps:
      - name: Require successful complete upstream
        env:
          UPSTREAM_RESULT: ${{ needs.test.result }}
        run: test "$UPSTREAM_RESULT" = success
      - name: Prepare isolated job paths
        run: |
          set -euo pipefail
          CI_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/dailycheck-${CI_RUN_ID}-${CI_RUN_ATTEMPT}.XXXXXX")"
          mkdir -p "${CI_ROOT}/tmp" "${CI_ROOT}/db"
          printf 'CI_ROOT=%s\nTMPDIR=%s/tmp\nDAILYCHECK_CI_TMP=%s/tmp\nDAILYCHECK_DB_DIR=%s/db\n' \
            "$CI_ROOT" "$CI_ROOT" "$CI_ROOT" "$CI_ROOT" >> "$GITHUB_ENV"

      - name: Checkout candidate H on GitHub
        if: github.server_url == 'https://github.com'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout candidate H on Gitea
        if: github.server_url != 'https://github.com'
        env:
          CHECKOUT_SERVER: ${{ github.server_url }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64, os, re, subprocess
          from urllib.parse import urlsplit
          server = os.environ["CHECKOUT_SERVER"].rstrip("/")
          parsed = urlsplit(server)
          repo, head, base = (os.environ[k] for k in ("CI_REPOSITORY", "CI_HEAD_SHA", "CI_BASE_SHA"))
          token = os.environ["CHECKOUT_TOKEN"]
          if (parsed.scheme not in {"http", "https"} or not parsed.hostname or parsed.username
                  or parsed.password or parsed.path or parsed.query or parsed.fragment
                  or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo)
                  or not re.fullmatch(r"[0-9a-f]{40}", head) or not token
                  or any(ord(c) < 33 or ord(c) == 127 for c in token)
                  or base and not re.fullmatch(r"[0-9a-f]{40}", base)):
              raise SystemExit("invalid source checkout identity/credentials")
          workspace = os.environ["GITHUB_WORKSPACE"]
          auth = base64.b64encode(("x-access-token:" + token).encode()).decode()
          env = {**os.environ, "GIT_TERMINAL_PROMPT": "0", "GIT_CONFIG_COUNT": "2",
                 "GIT_CONFIG_KEY_0": f"http.{server}/.extraheader",
                 "GIT_CONFIG_VALUE_0": "AUTHORIZATION: basic " + auth,
                 "GIT_CONFIG_KEY_1": "safe.directory", "GIT_CONFIG_VALUE_1": workspace}
          def git(*args):
              subprocess.run(["git", *args], cwd=workspace, env=env, check=True)
          git("init")
          existing = subprocess.run(["git", "remote", "get-url", "origin"], cwd=workspace, env=env, capture_output=True)
          git("remote", "set-url" if existing.returncode == 0 else "add", "origin", f"{server}/{repo}.git")
          git("fetch", "--force", "--no-tags", "origin", "+refs/heads/main:refs/remotes/origin/main", head, *([base] if base else []))
          git("checkout", "--force", "--detach", head)
          git("clean", "-ffdx")
          PYCODE

      - name: Setup Python on GitHub
        if: github.server_url == 'https://github.com'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python on Gitea (runner image)
        if: github.server_url != 'https://github.com'
        run: python3 --version && python3 -m pip --version

      - name: Execute approved isolated native producer
        id: native_producer
        if: env.CI_NATIVE_PRODUCER == 'true'
        env:
          CI_PRODUCER_MANIFEST_BLOB: df4cb77671515cc50be9c3465290347b8a1ede76
          NATIVE_QUEUE_READ_TOKEN: ${{ github.token }}
          NATIVE_CONTEXT: agent-framework-reports
          UPSTREAM_RESULT: ${{ needs.test.result }}
          NATIVE_TEST_B64: ${{ needs.test.outputs.native_test_b64 }}
          UPSTREAM_MEMBER_MANIFEST_B64: ${{ needs.test.outputs.member_manifest_b64 }}
        run: |
          set -euo pipefail
          # Literal approved manifest blob; HEAD/PR body cannot select a pin.
          # The platform Python is isolated from candidate imports and venvs.
          python3 -I - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          pin = os.environ["CI_PRODUCER_MANIFEST_BLOB"]
          def blob(oid):
              raw = subprocess.check_output(["git", "cat-file", "blob", oid])
              actual = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
              if actual != oid: raise SystemExit("approved producer object changed")
              return raw
          raw = blob(pin)
          manifest = json.loads(raw)
          root = pathlib.Path(os.environ["CI_ROOT"], "authority")
          root.mkdir()
          for name, oid in manifest["files"].items():
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts: raise SystemExit("invalid producer path")
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(blob(oid))
          (root / "scripts/ci/producer_manifest.json").write_bytes(raw)
          (root / "dc_approved_evidence.py").write_bytes((root / "scripts/ci/pytest_evidence.py").read_bytes())
          for package in ("scripts", "scripts/ci", "scripts/agent_framework"):
              (root / package / "__init__.py").write_bytes(b"")
          PYCODE
          # GitHub standard VM: the fixed trusted producer runs with passwordless
          # sudo only so it can own/remove UID65532 private scratch. Only the
          # explicit required CI/event/upstream/read-token variables are kept;
          # no import path or candidate venv is inherited and Python runs with -I.
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            sudo -n --preserve-env=CI_ROOT,CI_PRODUCER_MANIFEST_BLOB,NATIVE_CONTEXT,NATIVE_QUEUE_READ_TOKEN,NATIVE_TEST_B64,UPSTREAM_RESULT,UPSTREAM_MEMBER_MANIFEST_B64,CI_REPOSITORY,CI_RUN_ID,CI_RUN_ATTEMPT,CI_EVENT,CI_HEAD_SHA,CI_BASE_SHA,CI_GROUP_SHA,CI_EVENT_SHA,GITHUB_EVENT_PATH,GITHUB_OUTPUT,GITHUB_SERVER_URL \
              python3 -I "${CI_ROOT}/authority/scripts/ci/trusted_producer.py" job --context "${NATIVE_CONTEXT}"
          else
            python3 -I "${CI_ROOT}/authority/scripts/ci/trusted_producer.py" job --context "${NATIVE_CONTEXT}"
          fi
      - name: Upload native failure diagnostics
        if: failure() && github.server_url == 'https://github.com' && env.CI_NATIVE_PRODUCER == 'true' && steps.native_producer.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-diagnostics-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_ROOT }}/native-diagnostics
          if-no-files-found: ignore
          retention-days: 2
      - name: Resolve authenticated merge-group members
        id: member_manifest
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.event_name == 'merge_group')
        env:
          NATIVE_QUEUE_READ_TOKEN: ${{ github.token }}
          UPSTREAM_MEMBER_MANIFEST_B64: ${{ needs.test.outputs.member_manifest_b64 }}
        run: |
          test -n "${UPSTREAM_MEMBER_MANIFEST_B64}"
          python3 scripts/ci/merge_group.py manifest --manifest "${CI_ROOT}/members.json"
          printf 'CI_MEMBER_MANIFEST=%s/members.json\n' "$CI_ROOT" >> "$GITHUB_ENV"

      - name: Bind tested H and event H/B to this run
        if: env.CI_NATIVE_PRODUCER != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${CI_ROOT}/tmp" "${CI_ROOT}/db"
          python3 scripts/ci/candidate_binding.py "${CI_ROOT}/binding.json"

      - name: Decode pytest summary from test job
        if: env.CI_NATIVE_PRODUCER != 'true'
        env:
          PYTEST_SUMMARY_B64: ${{ needs.test.outputs.pytest_summary_b64 }}
          PYTEST_ENVELOPE_SHA256: ${{ needs.test.outputs.pytest_envelope_sha256 }}
        run: |
          set -euo pipefail
          test -n "${PYTEST_SUMMARY_B64}"
          set --
          if [[ "${GITHUB_SERVER_URL:-}" == "https://github.com" ]]; then
            test -n "${PYTEST_ENVELOPE_SHA256}"
            set -- --expected-envelope-sha256 "${PYTEST_ENVELOPE_SHA256}"
          fi
          mkdir -p ${CI_ROOT}/ci-pytest
          printf '%s' "${PYTEST_SUMMARY_B64}" | base64 --decode > ${CI_ROOT}/ci-pytest/pytest-result.json
          python3 scripts/ci/pytest_summary.py --decode ${CI_ROOT}/ci-pytest/pytest-result.json \
            --text-output "${CI_ROOT}/ci-pytest/pytest-output.txt" --evidence-output "${CI_ROOT}/ci-pytest/pytest-evidence.json" --binding-file "${CI_ROOT}/binding.json" --envelope-output "${CI_ROOT}/envelope.json" "$@"
          test -s ${CI_ROOT}/ci-pytest/pytest-output.txt

      - name: Install dependencies
        if: env.CI_NATIVE_PRODUCER != 'true'
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            unset PIP_INDEX_URL PIP_TRUSTED_HOST
          fi
          python3 -m venv "${CI_ROOT}/venv"
          ${CI_ROOT}/venv/bin/pip install -r requirements.txt -q
          ${CI_ROOT}/venv/bin/pip install pytest "ruff==0.16.10" "PyYAML==6.0.3" radon bandit -q

      - name: Merge-group member obligations
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.event_name == 'merge_group')
        env:
          NATIVE_QUEUE_READ_TOKEN: ${{ github.token }}
          UPSTREAM_MEMBER_MANIFEST_B64: ${{ needs.test.outputs.member_manifest_b64 }}
          PYTEST_REUSE_FILE: ${{ env.CI_ROOT }}/ci-pytest/pytest-output.txt
          PYTEST_REUSE_EVIDENCE: ${{ env.CI_ROOT }}/ci-pytest/pytest-evidence.json
        run: |
          export PATH="${CI_ROOT}/venv/bin:$PATH"
          python3 scripts/ci/merge_group.py reports --manifest "${CI_ROOT}/members.json"

      # 同一既有必需 check：台账必须与全部实现/文档一致，再验证 PR 的影响声明。
      # BASE_SHA 只作 main 参考；检查器内部用 merge-base，避免计入他人 main 变更。
      - name: MCP contracts and PR impact gate
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.event_name == 'pull_request')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          mkdir -p ${CI_ROOT}/pr
          printf '%s\n' "$PR_BODY" > ${CI_ROOT}/pr/body.md
          ${CI_ROOT}/venv/bin/python -m scripts.mcp_contracts --check
          ${CI_ROOT}/venv/bin/python scripts/agent_framework/check_mcp_impact.py --base "${BASE_SHA}" --body-file ${CI_ROOT}/pr/body.md

      - name: Generate reports 02 + 03
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.event_name == 'pull_request')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PYTEST_REUSE_FILE: ${{ env.CI_ROOT }}/ci-pytest/pytest-output.txt
          PYTEST_REUSE_EVIDENCE: ${{ env.CI_ROOT }}/ci-pytest/pytest-evidence.json
        run: |
          # Required report generation must finish successfully before attestation.
          export PATH=${CI_ROOT}/venv/bin:$PATH
          bash scripts/agent_framework/generate_reports.sh

      - name: Generate report 04 (local deploy preview)
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.event_name == 'pull_request')
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          export PATH="${CI_ROOT}/venv/bin:$PATH"
          bash scripts/agent_framework/preview.sh "${PR_NUM}"

      - name: Check four reports gate
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.event_name == 'pull_request')
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p ${CI_ROOT}/pr
          echo "$PR_BODY" > ${CI_ROOT}/pr/body.md
          PR_BODY_FILE=${CI_ROOT}/pr/body.md PR_NUM="${PR_NUM}" ${CI_ROOT}/venv/bin/python scripts/agent_framework/check_reports.py

      # 红线机验（2026-10-24 新增）：workflow.md §四 的 6 条红线此前全是自述，
      # PR #13 改了 .github/workflows/ci.yml（红线 2）被自行合并，没人拦得住。
      # 这里把「改了什么」变成判据：命中红线且 PR body 无 owner 授权 → 本 job 红。
      - name: Redline check（命中红线须 owner 授权）
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.event_name == 'pull_request')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p ${CI_ROOT}/pr
          echo "$PR_BODY" > ${CI_ROOT}/pr/body.md
          ${CI_ROOT}/venv/bin/python scripts/agent_framework/check_redlines.py \
            --base "${BASE_SHA}" --body-file ${CI_ROOT}/pr/body.md

      # 开工规范机验（2026-10-24 新增，Issue #26）：分支前缀 / issue 号一致性 /
      # 无号分支必须声明。此前这些规矩只活在 Dev Agent 的本地记忆里，换 session 就丢。
      - name: PR hygiene check（分支命名 + issue 关联）
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.event_name == 'pull_request')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          mkdir -p ${CI_ROOT}/pr
          echo "$PR_BODY" > ${CI_ROOT}/pr/body.md
          ${CI_ROOT}/venv/bin/python scripts/agent_framework/check_pr_hygiene.py \
            --branch "${PR_BRANCH}" --base "${BASE_SHA}" --body-file ${CI_ROOT}/pr/body.md

      - name: Attest reports evidence for independent Prod reader
        if: env.CI_NATIVE_PRODUCER != 'true' && (github.server_url == 'https://github.com')
        run: |
          python3 scripts/ci/merge_group.py attest --context agent-framework-reports --manifest "${CI_ROOT}/members.json"
