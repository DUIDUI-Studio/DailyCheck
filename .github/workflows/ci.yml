# DailyCheck CI：测试门禁 + 部署（deploy 依赖 test 通过）
#
# 零新增失败门禁：tests/known_failures.txt 是已知 pre-existing 失败基线（只许收缩）。
# tests/mcp_server 在 runner 上不经容器、无法等价复现，故 CI 跳过（known_failures.txt
# 仍收录其 2 条，本地/容器全量跑时同样受门禁约束）。商业化前须归零并恢复 CI 覆盖。
name: CI

env:
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  PIP_TRUSTED_HOST: mirrors.aliyun.com

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: http://172.28.129.216:3000/eric/actions-checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Python（镜像自带 3.12 + pip）
        run: python3 --version && python3 -m pip --version

      - name: Install dependencies
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -r requirements.txt -q
          /opt/venv/bin/pip install pytest "ruff==0.16.10" -q

      - name: Ruff (changed .py files only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 三点 diff（merge-base）只算「本分支引入的改动」。用两点会把 base
            # 之后 main 上别人合入的改动也列进来 —— 2026-10-24 PR #22 实测：
            # 分支落后 main 一个提交，于是列出了已被删除的
            # tests/test_store_ordering_board.py，ruff 报 E902 整步失败。
            # --diff-filter=d 再兜一层：本分支自己删掉的 .py 不喂给 ruff。
            FILES=$(git diff --name-only --diff-filter=d \
              "${{ github.event.pull_request.base.sha }}...HEAD" -- '*.py')
          else
            FILES=$(git diff --name-only --diff-filter=d "HEAD~1" -- '*.py')
          fi
          if [ -n "$FILES" ]; then
            echo "ruff checking: $FILES"
            /opt/venv/bin/ruff check $FILES
          else
            echo "no python files changed, skip"
          fi

      - name: Pytest (full suite, mcp_server excluded — container-gated, see header)
        run: |
          set +e
          /opt/venv/bin/python -m pytest --basetemp=/tmp/pytest-dc -q --tb=no \
            --ignore=tests/mcp_server > /tmp/pytest-output.txt
          tail -3 /tmp/pytest-output.txt

      - name: Zero-new-failure gate
        run: /opt/venv/bin/python scripts/check_known_failures.py /tmp/pytest-output.txt

      # 把 pytest 原始输出交给 reports job 复用，避免全量重跑（2 vCPU 上省约 20 分钟）
      - name: Upload pytest output for reports job
        if: always()
        uses: http://172.28.129.216:3000/actions/upload-artifact@v4
        with:
          name: pytest-output
          path: /tmp/pytest-output.txt
          retention-days: 7

  agent-framework-reports:
    # Phase MVE: 四报告门禁（独立 status check，让 branch protection 可独立勾选）
    # 详见 docs/agent-framework/v0.1.md §三
    # 上游 test 失败则跳过（test 失败即阻断，无需跑 reports）
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: http://172.28.129.216:3000/eric/actions-checkout@v4
        with:
          persist-credentials: false
          # 红线检查与 generate_reports.sh 都要 `git diff BASE_SHA..HEAD`，
          # 默认 fetch-depth=1 时 base commit 不在本地，diff 会失败 —— 而
          # generate_reports.sh 那条是 `|| true`，失败被静默吞掉。
          fetch-depth: 0

      # 下载失败不阻塞：generate_reports.sh 检测不到文件会自动重跑 pytest
      - name: Download pytest output from test job
        uses: http://172.28.129.216:3000/actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pytest-output
          path: /tmp/ci-pytest

      - name: Python（镜像自带 3.12 + pip）
        run: python3 --version && python3 -m pip --version

      - name: Install dependencies
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -r requirements.txt -q
          /opt/venv/bin/pip install pytest "ruff==0.16.10" radon bandit -q

      - name: Generate reports 02 + 03
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          # 即便脚本退出非 0 也跑完（让 reports/ 至少部分生成供 review 看）
          export PATH=/opt/venv/bin:$PATH
          bash scripts/agent_framework/generate_reports.sh || echo "[warn] generate_reports exit non-zero"

      - name: Generate report 04 (local deploy preview)
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          bash scripts/agent_framework/preview.sh "${PR_NUM}" || echo "[warn] preview exit non-zero"

      - name: Check four reports gate
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p /tmp/pr
          echo "$PR_BODY" > /tmp/pr/body.md
          PR_BODY_FILE=/tmp/pr/body.md PR_NUM="${PR_NUM}" /opt/venv/bin/python scripts/agent_framework/check_reports.py

      # 红线机验（2026-10-24 新增）：workflow.md §四 的 6 条红线此前全是自述，
      # PR #13 改了 .github/workflows/ci.yml（红线 2）被自行合并，没人拦得住。
      # 这里把「改了什么」变成判据：命中红线且 PR body 无 owner 授权 → 本 job 红。
      - name: Redline check（命中红线须 owner 授权）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p /tmp/pr
          echo "$PR_BODY" > /tmp/pr/body.md
          /opt/venv/bin/python scripts/agent_framework/check_redlines.py \
            --base "${BASE_SHA}" --body-file /tmp/pr/body.md

      - name: Upload reports as artifact
        if: always()
        uses: http://172.28.129.216:3000/actions/upload-artifact@v4
        with:
          name: agent-framework-reports
          path: reports/
          retention-days: 14

  deploy:
    needs: test
    # 生产部署暂禁自动触发（2026-10-11 Eric 拍板）：仅允许 workflow_dispatch 手动执行。
    # 生产部署正式启用前须：至少一次手动 workflow_dispatch 演练跑通。
    # （2026-10-24 修订：原列「备份 cron + 异地副本」已移除——备份 cron 早就在跑，
    #   部署流程不触碰数据库且 deploy_vps.sh 自身即做库快照，异地副本属独立容灾议题）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: http://172.28.129.216:3000/eric/actions-checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to VPS (backup → switch → migrate → health-check → auto-rollback)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # 私钥写在工作区之外（2026-10-24 首次演练暴露，Issue #9）：
          # 原先把 key 落在仓库根目录，tar 打包时把它一起带走 → 解包到
          # /root/releases/<ts>/vps_key → rsync 进生产 /root/DailyCheck/vps_key。
          # 现在放到 mktemp 的临时文件，并用 trap 保证退出即删。
          SSH_KEY=$(mktemp "${TMPDIR:-/tmp}/ci-deploy-key.XXXXXX")
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"
          trap 'rm -f "$SSH_KEY"' EXIT
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p $VPS_PORT -i $SSH_KEY $VPS_USERNAME@$VPS_HOST"

          # Build tar locally — 严格排除数据/运行时文件（*.db 覆盖所有库文件，
          # 但保留 db/ Python 包），部署永不触碰生产数据。
          # vps_key 仍是排除项：防的是分支上残留的旧版本脚本 / 本地遗留文件。
          tar --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='*.log' \
              --exclude='*.db' \
              --exclude='backups' \
              --exclude='.venv' \
              --exclude='.workbuddy' \
              --exclude='.claude' \
              --exclude='node_modules' \
              --exclude='issue-reports' \
              --exclude='graphify-out' \
              --exclude='vps_key' \
              --exclude='*.pem' \
              -czf /tmp/dailycheck.tar.gz .

          # 解压到带时间戳的 release 目录，由 deploy_vps.sh 完成切换/迁移/回滚
          REL=$($SSH 'echo /root/releases/$(date +%Y%m%d-%H%M%S)')
          $SSH "mkdir -p $REL"
          # tar 必须从 stdin 读（-）：上一版写成读远端 /tmp/dailycheck.tar.gz，
          # 而那行 `cat > /tmp/...` 在 CI 里 stdin 是空的，只创建了 0 字节文件，
          # 导致远端 tar 报 "unexpected end of file"。2026-10-24 首次真实演练暴露。
          cat /tmp/dailycheck.tar.gz | $SSH "tar -xzf - -C $REL"
          $SSH "bash -s $REL" < scripts/deploy_vps.sh
